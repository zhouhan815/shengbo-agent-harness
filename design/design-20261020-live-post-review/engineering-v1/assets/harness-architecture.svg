<text x="1094" y="599" font-size="18" font-weight="650">经营专题（按需）</text>
<text x="1094" y="625" font-size="15" font-weight="400">漏斗／基线／退款／反例</text>
<rect x="760" y="600" width="260" height="150" rx="10" fill="#e7f1ff" stroke="#aebad0" stroke-width="1.6"/>
<text x="774" y="629" font-size="18" font-weight="650">四份按需Skill</text>
<text x="774" y="655" font-size="15" font-weight="400">数据资格；经营诊断</text>
<text x="774" y="680" font-size="15" font-weight="400">内容与顾客反馈</text>
<text x="774" y="705" font-size="15" font-weight="400">下场实验与反馈</text>
<text x="774" y="730" font-size="15" font-weight="400">按角色加载，不替代权限</text>
<rect x="1050" y="700" width="320" height="75" rx="10" fill="#e5f4ee" stroke="#aebad0" stroke-width="1.6"/>
<text x="1064" y="729" font-size="18" font-weight="650">K00–K13 + 五个F工具流</text>
<text x="1064" y="755" font-size="15" font-weight="400">typed契约；内部机械步骤复用</text>
<rect x="1430" y="110" width="340" height="320" rx="16" fill="#fffdf3" stroke="#c7ceb9" stroke-width="2"/>
<text x="1448" y="143" font-size="20" font-weight="650">④ 既有模型来源</text>
