<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1360" viewBox="0 0 1800 1360" role="img"><title>播中播后综合Agent Harness总架构</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66758b"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f8f4"/>
<style>text{font-family:Segoe UI,Microsoft YaHei,sans-serif;fill:#25334a} .line{fill:none;stroke:#758399;stroke-width:2;marker-end:url(#arr)} .dash{stroke-dasharray:7 5}</style>
<text x="30" y="44" font-size="30" font-weight="700">播中只采集 · 播后自主分析 · 人工采纳后交给播前</text>
<text x="30" y="76" font-size="17" font-weight="400">所有Review组件为待实施设计；复用现有8765／8791，不增加第三个服务。</text>
<rect x="30" y="110" width="310" height="320" rx="16" fill="#fffdf3" stroke="#c7ceb9" stroke-width="2"/>
<text x="48" y="143" font-size="20" font-weight="650">① Agent工作台</text>
<rect x="50" y="175" width="270" height="90" rx="10" fill="#eef1ff" stroke="#aebad0" stroke-width="1.6"/>
<text x="64" y="204" font-size="18" font-weight="650">右侧：对话与任务</text>
<text x="64" y="230" font-size="15" font-weight="400">过程开关默认关闭</text>
<text x="64" y="255" font-size="15" font-weight="400">展开安全参数／进度／耗时</text>
<rect x="50" y="295" width="270" height="100" rx="10" fill="#eef1ff" stroke="#aebad0" stroke-width="1.6"/>
