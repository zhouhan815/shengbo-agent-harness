<text x="1069" y="1015" font-size="15" font-weight="400">新算／复用有执行证明</text>
<text x="1069" y="1040" font-size="15" font-weight="400">用量先落账再校内容</text>
<text x="1069" y="1065" font-size="15" font-weight="400">模型／工具／阶段精细计时</text>
<text x="1069" y="1090" font-size="15" font-weight="400">关闭UI开关仍持续记录</text>
<rect x="1430" y="490" width="340" height="710" rx="16" fill="#fffdf3" stroke="#c7ceb9" stroke-width="2"/>
<text x="1448" y="523" font-size="20" font-weight="650">⑦ 人工采纳闭环</text>
