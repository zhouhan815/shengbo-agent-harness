<text x="64" y="350" font-size="15" font-weight="400">来源／映射／四类评分</text>
<text x="64" y="375" font-size="15" font-weight="400">筛选、微调、确认采纳</text>
<rect x="380" y="110" width="320" height="320" rx="16" fill="#fffdf3" stroke="#c7ceb9" stroke-width="2"/>
<text x="398" y="143" font-size="20" font-weight="650">② 既有服务入口</text>
<rect x="400" y="175" width="280" height="90" rx="10" fill="#eef1ff" stroke="#aebad0" stroke-width="1.6"/>
<text x="414" y="204" font-size="18" font-weight="650">声播8765同源桥</text>
<text x="414" y="230" font-size="15" font-weight="400">身份／Origin／固定路径</text>
<rect x="400" y="300" width="280" height="95" rx="10" fill="#eef1ff" stroke="#aebad0" stroke-width="1.6"/>
<text x="414" y="329" font-size="18" font-weight="650">Agent8791 Review API</text>
<text x="414" y="355" font-size="15" font-weight="400">run／job／workspace／SSE</text>
<text x="414" y="380" font-size="15" font-weight="400">共享app，独立Review资源</text>
<rect x="740" y="110" width="650" height="700" rx="16" fill="#fffdf3" stroke="#c7ceb9" stroke-width="2"/>
<text x="758" y="143" font-size="20" font-weight="650">③ Deep Agents Harness</text>
<rect x="760" y="175" width="610" height="90" rx="10" fill="#eef1ff" stroke="#aebad0" stroke-width="1.6"/>
<text x="774" y="204" font-size="18" font-weight="650">ReviewRuntime + 可信Scope + 共享Provider账本</text>
<text x="774" y="230" font-size="15" font-weight="400">租约／Goal／等待／恢复／取消；包住整个ainvoke</text>
<rect x="760" y="300" width="610" height="125" rx="10" fill="#f0eaff" stroke="#aebad0" stroke-width="1.6"/>
<text x="774" y="329" font-size="18" font-weight="650">四个业务中间件</text>
<text x="774" y="355" font-size="15" font-weight="400">Scope：角色与引用权限；EvidenceContext：本轮证据投影</text>
<text x="774" y="380" font-size="15" font-weight="400">TraceBudget：调用／耗时／预算；Completion：完成或等待门</text>
<text x="774" y="405" font-size="15" font-weight="400">SDK另配置：TodoList、受控文件、Summary、受限SubAgent</text>
<rect x="760" y="465" width="260" height="100" rx="10" fill="#eef1ff" stroke="#aebad0" stroke-width="1.6"/>
<text x="774" y="494" font-size="18" font-weight="650">主复盘Agent</text>
<text x="774" y="520" font-size="15" font-weight="400">自主选工具／追加调查</text>
<text x="774" y="545" font-size="15" font-weight="400">不强制五段流程走一遍</text>
<rect x="1080" y="455" width="290" height="80" rx="10" fill="#eef1ff" stroke="#aebad0" stroke-width="1.6"/>
<text x="1094" y="484" font-size="18" font-weight="650">内容专题（按需）</text>
<text x="1094" y="510" font-size="15" font-weight="400">原稿／顾虑／四项内容评级</text>
