<text x="1464" y="204" font-size="18" font-weight="650">chatgpt_plan / gpt-6.1-sol</text>
<text x="1464" y="230" font-size="15" font-weight="400">沿用安全授权／自动续期</text>
<text x="1464" y="255" font-size="15" font-weight="400">真实发送前核最终wire预算</text>
<text x="1464" y="280" font-size="15" font-weight="400">主／子／摘要／分类共用账本</text>
<text x="1464" y="305" font-size="15" font-weight="400">不输出令牌／隐藏思维链</text>
