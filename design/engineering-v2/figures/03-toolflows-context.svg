<text x="225.5" y="1274.5" font-family="Microsoft YaHei,sans-serif" font-size="29" fill="#193447">F01—F04</text>
<text x="159.0" y="1315.5" font-family="Microsoft YaHei,sans-serif" font-size="29" fill="#193447">材料解析 / 历史影响</text>
<text x="188.5" y="1356.5" font-family="Microsoft YaHei,sans-serif" font-size="29" fill="#193447">商品校验与保存</text>
<text x="203.0" y="1397.5" font-family="Microsoft YaHei,sans-serif" font-size="29" fill="#193447">本场草案保存</text>
<text x="174.0" y="1438.5" font-family="Microsoft YaHei,sans-serif" font-size="29" fill="#193447">CAS / 回执 / 缺项</text>
<rect x="550" y="1230" width="400" height="230" rx="9" fill="#E6EDFF" stroke="#A7B7C3" stroke-width="2"/>
<text x="688.0" y="1276.0" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#193447">F05—F06</text>
<text x="610.0" y="1316.0" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#193447">完整上下文与模块计划</text>
<text x="610.0" y="1356.0" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#193447">按冻结计划生成 / 局改</text>
<text x="666.0" y="1396.0" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#193447">保留未改模块</text>
<text x="605.5" y="1436.0" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#193447">后台 job ≠ 自主 Agent</text>
<rect x="1010" y="1230" width="400" height="230" rx="9" fill="#E6EDFF" stroke="#A7B7C3" stroke-width="2"/>
<text x="1187.0" y="1277.5" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#193447">F07</text>
<text x="1074.5" y="1316.5" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#193447">卡片拖拽 / 同商品连续</text>
<text x="1088.0" y="1355.5" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#193447">尽量穿插 / 完全随机</text>
<text x="1059.0" y="1394.5" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#193447">预览 → 用户应用 → 编译</text>
<text x="1075.0" y="1433.5" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#193447">精确版本和重复项不丢</text>
<rect x="1470" y="1230" width="400" height="230" rx="9" fill="#E6EDFF" stroke="#A7B7C3" stroke-width="2"/>
<text x="1608.0" y="1276.0" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#193447">F08—F10</text>
<text x="1544.0" y="1316.0" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#193447">人工批准后必需 TTS</text>
<text x="1544.0" y="1356.0" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#193447">复盘导入与精确绑定</text>
<text x="1544.0" y="1396.0" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#193447">素材需求 / 已有文件</text>
<text x="1516.0" y="1436.0" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#193447">不生成视频，不自动开播</text>
<rect x="50" y="1630" width="1900" height="140" rx="9" fill="#FFF0DA" stroke="#A7B7C3" stroke-width="2"/>
<text x="786.5" y="1671.0" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#193447">F11 · 按原 Goal 回读验收真实成果</text>
<text x="599.0" y="1711.0" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#193447">只更新商品：商品 + 有效研究维护 + 话术影响清单；不自动改稿</text>
<text x="482.0" y="1751.0" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#193447">要求生稿：必须有实际正文；整场才检查批准 / 音频 / 候选；可选视觉缺失不挡声音</text>
