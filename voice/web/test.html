<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>声播 · 评论测试台</title><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/test.css"><link rel="icon" href="/assets/favicon.svg"></head>
<body><aside class="sidebar"><a class="brand" href="/">声播<span>LIVE STUDIO</span></a><nav><a class="nav-link" href="/#rooms">直播管理</a><a class="nav-link" href="/#products">商品库</a><a class="nav-link active" href="/test">评论测试台</a></nav><div class="side-bottom"><span class="dot"></span>本地保存<p>模拟输入 · 智能回复</p><small id="model-state">连接中</small></div></aside>
<main><header><div><h1>评论测试台</h1><p>选择直播间，输入模拟评论，查看回复与检索依据</p></div><div class="header-actions"><a id="room-monitor" class="button-link" href="/#rooms">查看直播监控</a><button id="export-test">导出测试记录</button></div></header>
<div id="notice" role="status" aria-live="polite" hidden></div>
<div class="panel test-binding"><label>配对直播间<select id="lab-room" aria-label="配对直播间"></select></label><label>当前讲解商品<select id="lab-product" aria-label="当前讲解商品"></select></label><div><strong id="knowledge-count">加载本场资料…</strong><p class="muted">商品信息来自商品库，测试会话单独保存</p></div><button id="refresh-knowledge">刷新商品资料</button></div>
<div class="lab-layout"><section class="panel lab-chat"><div class="toolbar"><div><h2>模拟评论与回复</h2><p class="muted">回复仅在测试台展示</p></div><button id="new-session">＋ 新测试</button></div><label>本直播间的历史测试<select id="lab-session" aria-label="历史测试"></select></label>
<div id="chat-feed" class="chat-feed" role="log" aria-live="polite"><div class="empty-state">先选择一个直播间。</div></div>
<form id="comment-form" class="comment-compose"><div class="row"><label>模拟观众<input id="lab-username" value="测试观众" maxlength="40" required></label><span id="reply-progress" role="status">记录保存在本机</span></div><label class="compose-label">评论<textarea id="lab-comment" rows="3" maxlength="500" placeholder="例如：脚背宽怎么选尺码？大概多久发货？" required></textarea></label><div class="toolbar"><span class="muted">Enter 发送 · Shift+Enter 换行</span><button id="send-comment" type="submit" class="primary">发送评论并回复</button></div></form></section>
<aside class="lab-reference"><section class="panel"><nav class="reference-tabs"><button id="show-docs" aria-selected="true">本场知识</button><button id="show-prompt" aria-selected="false">回复规则</button></nav><div id="knowledge-view"><p class="muted">资料按文档切片，先检索再回复；命中分数用于排序，不代表正确率。</p><div id="document-list"></div></div><div id="prompt-view" hidden><p class="muted">实际发送给 DeepSeek 的系统提示词</p><pre id="reply-prompt"></pre><small id="prompt-revision" class="muted"></small></div></section>
<section class="panel event-simulator"><h2>模拟互动事件</h2><p class="muted">点赞、进房可送到配对直播间的监控台。输入评论请用左侧聊天框。</p><div class="row"><button id="simulate-enter">模拟用户进房</button><button id="simulate-like">模拟点赞</button></div><p id="simulator-result" role="status"></p></section></aside></div>
</main><script src="/assets/test.js"></script></body></html>
